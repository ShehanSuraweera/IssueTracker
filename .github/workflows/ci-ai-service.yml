name: CI — AI service

# WHEN: pushes to feature branches and pull requests that touch the AI service,
#       and as the required first step of deploy-ai-service.yml (workflow_call)
# WHY: lint, type-check and test the Python service, and check that its Docker
#      image builds. Tests use scripted and fake providers, so CI needs no API
#      key and makes no network calls to Gemini.
#      Pushes to main are skipped here because deploy-ai-service.yml runs this
#      workflow for them; otherwise the tests would run twice.
on:
  push:
    branches-ignore: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ci-ai-service.yml"
  workflow_call:
    inputs:
      build-image:
        description: Also check that the Docker image builds
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ai-service:
    name: AI service — lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to a full commit SHA: a tag can be moved to different code, a
      # SHA can't. setup-uv publishes no floating major tag (no "@v10").
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # always tests exactly the dependency versions that are committed.
      # uv also installs the Python version pinned in .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

  # The deploy workflow builds and pushes the image itself, so it passes
  # build-image: false. On pushes and pull requests the input is unset.
  image:
    name: AI service — Docker image builds
    if: ${{ inputs.build-image != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
