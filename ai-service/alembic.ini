# Alembic configuration for the AI service's `ai` schema.
# Run migrations with `uv run ai-db migrate` rather than calling alembic
# directly: the command supplies the database URL from AI_DATABASE_URL.

[alembic]
script_location = migrations
# The URL is set at runtime by ai_service.db.cli; never put credentials here.
sqlalchemy.url =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
